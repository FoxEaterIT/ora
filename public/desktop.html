<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ora</title><style>
:root{font:14px system-ui;color:var(--ink);background:var(--bg);--bg:#f5f8f7;--surface:#fff;--ink:#15231f;--muted:#61716c;--line:#dfe7e4;--brand:#147d67;--danger:#a22;color-scheme:light}html[data-theme="dark"]{--bg:#111916;--surface:#1b2521;--ink:#edf5f1;--muted:#a2b2aa;--line:#34433c;--brand:#48b99a;--danger:#ff8a8a;color-scheme:dark}html[data-theme="ora-blue"]{--brand:#3974d8}html[data-theme="ora-green"]{--brand:#23825d}html[data-theme="ora-purple"]{--brand:#8153c7}html[data-theme="ora-orange"]{--brand:#d8752e}*{box-sizing:border-box}body{margin:0;background:var(--bg);min-height:100vh}header{height:68px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-bottom:1px solid var(--line)}.brand{font-size:19px;font-weight:700;letter-spacing:-.03em}.controls{display:flex;align-items:center;gap:10px}button,input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px}button{cursor:pointer}.icon{width:38px;height:38px;padding:0;border-radius:50%;font-weight:700}.menu{position:absolute;right:18px;top:58px;z-index:2;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:230px;box-shadow:0 12px 32px #0002}.menu p{margin:2px 0 12px}.menu button{width:100%;text-align:left}.hidden{display:none!important}.modal-backdrop{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;background:#0008}.modal{width:min(410px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 16px 48px #0004}.modal h2{margin:0 0 8px}.modal input{width:100%;margin:10px 0}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}main{width:min(680px,calc(100% - 32px));margin:58px auto}.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 8px 26px #00000008}.login{max-width:410px;margin:11vh auto}.login h1{margin-top:0}.field{display:grid;gap:7px;margin:14px 0}.field input,.field select{width:100%}.primary{background:var(--brand);color:white;border:0;font-weight:650;padding:12px 18px}.row{display:flex;gap:10px;align-items:end}.row .field{flex:1}.timer{text-align:center;padding:25px 0}.timer strong{font:600 52px ui-monospace,monospace;letter-spacing:-.05em}.project{color:var(--muted);margin:12px 0 22px}.error{color:var(--danger);min-height:20px}.today{color:var(--muted);font-size:13px;margin-top:18px}@media(max-width:500px){header{padding:0 12px}.controls{gap:5px}main{margin-top:30px}.card{padding:18px}.row{align-items:stretch;flex-direction:column}.timer strong{font-size:40px}}
</style></head><body>
<header><div class="brand" id="brand"></div><div class="controls" id="controls" hidden><button id="mode" title="Toggle dark/light">☾</button><select id="theme" aria-label="Theme"><option value="ora-default">Default</option><option value="ora-blue">Blue</option><option value="ora-green">Green</option><option value="ora-purple">Purple</option><option value="ora-orange">Orange</option></select><button class="icon" id="userButton" aria-label="Account menu">U</button></div><div class="menu hidden" id="userMenu"><p id="userName"><b></b></p><p id="userEmail" class="muted"></p><button id="logout">Sign out</button></div></header>
<div id="serverModal" class="modal-backdrop hidden"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="serverTitle"><h2 id="serverTitle">Ora server</h2><p class="muted">Enter the base URL for your Ora server.</p><input id="serverUrl" type="url" value="http://localhost:44444" autocomplete="url"><p class="error" id="serverError"></p><div class="modal-actions"><button id="serverCancel">Cancel</button><button class="primary" id="serverContinue">Continue</button></div></section></div><main><section class="card login" id="login"><h1>Sign in to Ora</h1><p class="muted">Use your Ora account credentials.</p><label class="field">Email<input id="email" type="email" autocomplete="username" required></label><label class="field">Password<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" id="loginButton">Sign in</button><p class="error" id="loginError"></p></section><section class="card hidden" id="app"><div class="row"><label class="field">Project<select id="project"></select></label><label class="field">What are you doing?<input id="description" placeholder="Optional description"></label></div><div class="timer"><strong id="elapsed">00:00:00</strong><div class="project" id="running"></div><button class="primary" id="start">Start timer</button><button class="primary hidden" id="stop">Stop timer</button><p class="today" id="today"></p></div><p class="error" id="error"></p></section></main>
<script>
let base='',headers={},user=null,entries=[];const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,opts={}){const r=await fetch(base+path,{...opts,headers:{...headers,...opts.headers}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}function showError(e){$('error').textContent=e.message}function setTheme(theme){document.documentElement.dataset.theme=theme;localStorage.setItem('ora-desktop-theme',theme)}const saved=localStorage.getItem('ora-desktop-theme');if(saved)setTheme(saved);$('theme').value=saved&&saved!=='dark'?saved:'ora-default';$('mode').onclick=()=>{const dark=document.documentElement.dataset.theme==='dark';setTheme(dark?$('theme').value:'dark')};$('theme').onchange=()=>{if(document.documentElement.dataset.theme!=='dark')setTheme($('theme').value);else localStorage.setItem('ora-desktop-theme',$('theme').value)};
$('loginButton').onclick=()=>{$('loginError').textContent='';$('serverError').textContent='';$('serverModal').classList.remove('hidden');$('serverUrl').focus()};$('serverCancel').onclick=()=> $('serverModal').classList.add('hidden');$('serverContinue').onclick=async()=>{try{const parsed=new URL($('serverUrl').value.trim());if(!['http:','https:'].includes(parsed.protocol)||parsed.username||parsed.password||parsed.search||parsed.hash)throw Error('Enter a valid HTTP or HTTPS server URL.');base=parsed.origin;const d=await api('/api/desktop/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});headers={'X-Ora-Desktop-Token':d.session};user=d.user;$('serverModal').classList.add('hidden');$('login').classList.add('hidden');$('app').classList.remove('hidden');$('controls').hidden=false;$('userButton').textContent=(user.firstName||user.email).slice(0,1).toUpperCase();$('userName').innerHTML='<b>'+esc(user.name||user.email)+'</b>';$('userEmail').textContent=user.email;await load()}catch(e){$('serverError').textContent=e.message}};
async function load(){try{const [p,e]=await Promise.all([api('/api/projects'),api('/api/entries?mine=1')]);entries=e.entries||[];$('project').innerHTML=p.projects.filter(x=>!x.archived).map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');const running=entries.find(x=>!x.end);$('running').textContent=running?`${running.project.name}${running.description?' · '+running.description:''}`:'Ready to track time';$('start').classList.toggle('hidden',!!running);$('stop').classList.toggle('hidden',!running);const start=new Date();start.setHours(0,0,0,0);const total=entries.filter(x=>new Date(x.start)>=start||!x.end).reduce((sum,x)=>sum+((x.end?new Date(x.end).getTime():Date.now())-new Date(x.start).getTime()),0);$('today').textContent='Today: '+format(total);tick();}catch(e){showError(e)}}function format(ms){let n=Math.floor(ms/1000);return [Math.floor(n/3600),Math.floor(n%3600/60),n%60].map(x=>String(x).padStart(2,'0')).join(':')}function tick(){const r=entries.find(x=>!x.end);$('elapsed').textContent=r?format(Date.now()-new Date(r.start).getTime()):'00:00:00'}setInterval(tick,1000);
$('start').onclick=async()=>{try{await api('/api/entries',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({projectId:$('project').value,description:$('description').value})});$('description').value='';await load()}catch(e){showError(e)}};$('stop').onclick=async()=>{try{const r=entries.find(x=>!x.end);if(r)await api('/api/entries/'+r.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({end:new Date().toISOString()})});await load()}catch(e){showError(e)}};$('userButton').onclick=()=>$('userMenu').classList.toggle('hidden');$('logout').onclick=async()=>{try{await api('/api/desktop/logout',{method:'POST'})}catch{}headers={};base='';user=null;$('controls').hidden=true;$('userMenu').classList.add('hidden');$('app').classList.add('hidden');$('login').classList.remove('hidden');$('password').value=''};
</script></body></html>
