name: Attach Windows update archive

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  archive:
    runs-on: windows-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Validate version and create source archive
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $tag = $env:RELEASE_TAG -replace '^v', ''
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $version) { throw "Release tag $tag does not match package.json version $version" }
          $archive = "ora-$($env:RELEASE_TAG).zip"
          git archive --format=zip --output=$archive HEAD
          if ($LASTEXITCODE -ne 0) { throw "git archive failed" }
          Get-FileHash $archive -Algorithm SHA256
      - name: Attach archive to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$env:RELEASE_TAG" "ora-$env:RELEASE_TAG.zip" --clobber
